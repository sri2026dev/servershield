<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServerShield Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>🛡️ ServerShield</h1>
    <p>AI-Based Server Load Prediction System</p>

    <div class="dashboard">
        <div class="card">
            <h2>CPU Usage</h2>
            <h3 id="cpu">0%</h3>
        </div>

        <div class="card">
            <h2>RAM Usage</h2>
            <h3 id="ram">0%</h3>
        </div>

        <div class="card">
            <h2>Requests / Min</h2>
            <h3 id="requests">0</h3>
        </div>
    </div>

    <div class="card status">
        <h2>Server Status</h2>
        <h3 id="status">Checking...</h3>
        <p id="alert">Loading server data...</p>
    </div>

    <button onclick="loadData()">Refresh Data</button>

    <script>
        async function loadData() {
            const response = await fetch('/data');
            const data = await response.json();

            document.getElementById('cpu').textContent = data.cpu + '%';
            document.getElementById('ram').textContent = data.ram + '%';
            document.getElementById('requests').textContent = data.requests;
            document.getElementById('status').textContent = data.status;
            document.getElementById('alert').textContent = data.alert;
        }

        loadData();
        setInterval(loadData, 3000);
    </script>

</body>
</html>
